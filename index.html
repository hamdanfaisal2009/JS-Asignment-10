<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css"
    integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <title>Todo List</title>
</head>

<body>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Saira+Stencil+One&display=swap');


        body{
        background: #352f5b;
        font-family: 'Saira Stencil One', cursive;
        }

        .container{
        max-width: 400px;
        }

        input[type=text],
        input[type=text]:focus{
        color: #fff;
        border: none;
        background: rgba(0,0,0,0.2);
        max-width: 400px;
        }

        .todos li{
        background: #423a6f;
        color: white;
        }

        .delete{
        cursor: pointer;
        }

        .filtered{
        display: none !important;
        }
        
        .btn-1{
            color: white;
            transition:all 0.3s ease;
        }

        .btn-1:hover{
            color: #352f5b;
            background: rgb(218, 218, 218);
            font-size: medium;
            transform: scale( 1.05);
        }
    </style>

  <div class="container">

    <header class="text-center text-light my-4">
      <h1 class="mb-4">Todo List</h1>
      <form class="search">
        <input class="form-control rounded-3 m-auto pb-2" id="search-input" type="text" name="search" placeholder="Search Todos" onkeyup="myFunction()" />
      </form>
    </header>

    <ul class="list-group todos mx-auto text-light">
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <span>Read books</span>
        <div>
          <i class="fas fa-edit edit"></i>
          <i class="far fa-trash-alt delete"></i>
        </div>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <span>Workout</span>
        <div>
          <i class="fas fa-edit edit"></i>
          <i class="far fa-trash-alt delete"></i>
        </div>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <span>Learn JS</span>
        <div>
          <i class="fas fa-edit edit"></i>
          <i class="far fa-trash-alt delete"></i>
        </div>
      </li>
    </ul>

    <form class="add text-center my-4">
      <label class="text-light">Add a new todo...</label>
      <input class="form-control rounded-3 m-auto" type="text" name="add" />
      <button class="btn-1 btn btn-outline-info rounded-3 w-100 mt-3">Add Todo</button>
    </form>

  </div>


  <script src="app.js"></script>
</body>

</html>
